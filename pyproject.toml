[build-system]
requires      = ["setuptools>=61.0.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"


[project]
name            = "subdomain"
description     = "Domain identification from subcellular segmentation-free analysis."
readme          = { file = "README.md", content-type = "text/markdown" }
license         = { file = "LICENSE" }
requires-python = ">=3.11"
dynamic         = ["version"]

authors = [
    { name = "Niklas Müller-Bötticher", email = "niklas.mueller-boetticher@charite.de" },
]
dependencies = [
    "jax~=0.5",
    "numpy~=1.25",
    "pandas>=2",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "seaborn~=0.13",
    "fastcluster>=1.2.6",
    "colorcet>=3",
    "matplotlib-scalebar~=0.9",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]", "cuml-cu12==25.2"]
dev    = ["pre-commit"]

[project.urls]
Homepage      = "https://github.com/HiDiHlabs/subdomain"
Documentation = "https://HiDiHlabs.github.io/Subdomain"
Repository    = "https://github.com/HiDiHlabs/subdomain"
Issues        = "https://github.com/HiDiHlabs/subdomain/issues"


[tool]

[tool.setuptools.packages.find]
include = ["subdomain"]

[tool.setuptools_scm]


[tool.ruff]
target-version = "py311"

fix        = true
show-fixes = true

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
python_version         = "3.11"
ignore_missing_imports = true
warn_no_return         = false
packages               = "subdomain"
