site_name: SubDomain
site_url: https://HiDiHlabs.github.io/SubDomain/
repo_url: https://github.com/HiDiHlabs/SubDomain/
repo_name: HiDiHlabs/SubDomain
edit_uri: edit/main/docs/
copyright: Copyright 2025 HiDiHlabs

nav:
  - Home: index.md
  - install.md
  - tutorial.ipynb
  - reference.md

theme:
  name: material
  features:
    - content.code.copy
    # - navigation.tabs
    - navigation.tracking
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default

      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  icon:
    # repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

extra:
  version:
    default: stable
    provider: mike
    alias: true

plugins:
  - search
  - mkdocs-jupyter
  - mkdocstrings:
      default_handler: python
      enable_inventory: true
      handlers:
        python:
          options:
            docstring_style: numpy
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://numpy.org/doc/stable/objects.inv
            - https://docs.jax.dev/en/latest/objects.inv
            - https://pandas.pydata.org/docs/objects.inv
            - https://scikit-learn.org/stable/objects.inv
            - https://docs.rapids.ai/api/cuml/stable/objects.inv
            - https://seaborn.pydata.org/objects.inv
